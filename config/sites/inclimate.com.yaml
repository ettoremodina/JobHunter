job_url_pattern: inclimate.com/jobs/{id}
excludes:
- /about
- /companies
- /login
requires_js: true
pagination:
  type: none
  selector: null
  param: null
job_list_selector: .job-list-container
css_selector: main
markdown_parsing:
  title: "^#\\s+(.*)$"
  company: "^\\[(.*?)\\]\\((.*?)\\)$"
  lines_after_title:
    - null
    - location
    - work_model
    - job_type
    - posted_date
  description_start_after: "Apply Now"
fields:
  title: .job-title
  company: .company-name
  location: .job-location
  link: .job-link
  date: .job-date
# Add behavior so scraper knows what to do
scraper_behavior:
  cookie_banner_selector: '.iubenda-cs-accept-btn'
  cookie_timeout: 3000
  total_jobs_regex: 'Showing\\s+\\d+\\s+of\\s+(\\d+)\\s+jobs'
  load_more_button_text: 'Load More'
  card_selector: 'h3'
  job_url_filter: '/jobs/'
  listing_link_selector: "a:has-text('View details')"
