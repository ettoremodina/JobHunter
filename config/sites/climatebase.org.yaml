name: climatebase.org
entry_point: https://climatebase.org/jobs?experience_levels=Early+Career& # Update this if you have a specific filtered URL
job_url_pattern: "climatebase.org/job/"
excludes:
  - /login
  - /signup
  - /about
  - /companies
requires_js: true
url_ignore_filters: []

# Add behavior so scraper knows what to do
scraper_behavior:
  simple_link_extraction: true
  link_href_contains: '/job/'
  headless: false
  wait_until: 'domcontentloaded'

css_selector: 'body'

# We'll figure these out once we see the markdown output
markdown_parsing:
  title: "^#\\s+(.*)$"
  # This matches [![](image-url)Company Name](Company URL)
  company: "^\\[!\\[.*?\\]\\(.*?\\)(.*?)\\]\\((.*?)\\)$"
  lines_after_title:
    - location
    - work_model
    - posted_date
  description_start_after: "## About the Job"
